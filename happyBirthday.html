<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Открытка Ташуле ❤️</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: radial-gradient(circle at 50% 50%, #1a0010 0%, #0a0005 60%, #000 100%);
    overflow: hidden;
    font-family: 'Georgia', serif;
  }
  canvas { display: block; }

  .title {
    position: fixed; top: 5vh; left: 50%;
    transform: translateX(-50%);
    text-align: center; color: #ffd6e8;
    pointer-events: none; z-index: 10;
    opacity: 0; transition: opacity 2s ease;
  }
  .title.show { opacity: 1; }
  .title h1 {
    font-size: clamp(20px, 4vw, 42px);
    font-weight: 400; letter-spacing: 2px;
    text-shadow: 0 0 20px rgba(255, 100, 160, 0.8);
  }
  .title p {
    font-size: clamp(12px, 1.6vw, 18px);
    color: #ffb3d1; font-style: italic; margin-top: 6px;
  }

  .hint {
    position: fixed; bottom: 4vh; left: 50%;
    transform: translateX(-50%);
    color: #ff8fc0; font-size: 13px; letter-spacing: 1px;
    opacity: 0; transition: opacity 1.5s ease;
  }
  .hint.show { opacity: 0.85; animation: pulse 2.5s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: 0.35; } }

  .final-message {
    position: fixed; inset: 0;
    display: flex; justify-content: center; align-items: center;
    flex-direction: column;
    background: rgba(10, 0, 5, 0.78);
    backdrop-filter: blur(10px);
    color: #fff; text-align: center; padding: 20px;
    opacity: 0; pointer-events: none;
    transition: opacity 1s ease; z-index: 20;
  }
  .final-message.show { opacity: 1; pointer-events: auto; }
  .final-message h2 {
    font-size: clamp(24px, 5vw, 56px);
    background: linear-gradient(90deg, #ff5f9e, #ffb3d1, #ff5f9e);
    -webkit-background-clip: text; background-clip: text;
    color: transparent; margin-bottom: 20px;
  }
  .final-message p {
    font-size: clamp(14px, 2vw, 22px);
    max-width: 620px; line-height: 1.7;
    color: #ffd6e8; margin-bottom: 12px;
  }
</style>
</head>
<body>

<div class="title" id="title">
  <h1>С Днём Рождения, Ташуля!</h1>
  <p>каждый миг с тобой — это счастье</p>
</div>

<canvas id="heartCanvas"></canvas>

<div class="hint" id="hint">нажми на сердце 💗</div>

<div class="final-message" id="finalMessage">
  <h2>С твоим днем, мая любофь ❤️</h2>
  <p>Ты — самое лучшее, что случилось в моей жизни.</p>
  <p>Спасибо, что ты рядом. Пусть этот год принесёт тебе столько счастья, сколько звёзд на небе.</p>
  <p style="margin-top:20px; font-size:28px;">🎂✨🎁</p>
</div>

<script>
const canvas = document.getElementById('heartCanvas');
const ctx = canvas.getContext('2d');
const title = document.getElementById('title');
const hint = document.getElementById('hint');
const finalMessage = document.getElementById('finalMessage');

// ============ 50 уникальных фраз ============
const phrases = [
  "Будь такой же красивой","Будь такой же счастливой","Будь такой же нежной",
  "Будь такой же солнечной","Будь такой же любимой","Будь такой же волшебной",
  "Будь такой же сияющей","Будь такой же заботливой","Будь такой же искренней",
  "Будь такой же милой",
  "Ты прекрасна","Ты самая красивая","Ты моё солнышко","Ты моя мечта",
  "Ты моё вдохновение","Ты лучше всех","Ты — чудо","Ты моя нежность",
  "Ты свет моей жизни","Ты моё всё","Ты — моя вселенная","Ты — моё дыхание",
  "Ты моя радость","Ты моё сердце","Ты моя муза","Ты моя звёздочка",
  "Ты ангел мой","Ты моя прелесть","Ты моя родная","Ты моя любовь",
  "Желаю счастья","Желаю любви","Пусть мечты сбываются","Пусть глаза сияют",
  "Пусть сердце поёт","Сияй всегда","Цвети и расцветай","Будь самой счастливой",
  "С днём рождения","Люблю тебя","Обнимаю крепко",
  "Пусть всё сбудется","Свети всегда","Пусть удача рядом","Будь здорова",
  "Пусть сбудутся мечты","Моё вдохновенье","Целую нежно","Самой лучшей"
];

// ============ Формула сердца ============
function heartXY(t) {
  return {
    x: 16 * Math.pow(Math.sin(t), 3),
    y: 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t)
  };
}

// ============ Состояние ============
const FONT_FAMILY = "Georgia, 'Times New Roman', serif";
let W, H, centerX, centerY, scale;

let contourPts = [];
let textRelPts = [];

let drawStartMs = 0;
const DRAW_DURATION_MS = 4500;
const TRAIL_LENGTH = 250;

let drawComplete = false;
let textStartMs = 0;
let textDone = false;
let finaleStarted = false;
let lastBalloonSpawnMs = 0;
const BALLOON_SPAWN_INTERVAL = 180;  // мс между новыми шариками
const MAX_BALLOONS = 90;             // защита от перегрузки

// Эффекты
const particles = [];
const ripples = [];
const bokeh = [];
const sparkles = [];
const balloons = [];
const confetti = [];
const heartBursts = [];

let time = 0;

// ============ Сердцебиение ============
let beatPhase = 0;
const BEAT_PERIOD = 1.4;
let lastBeatIdx = -1;

function heartbeat(phase) {
  const p1 = Math.exp(-Math.pow((phase - 0.10) * 14, 2));
  const p2 = Math.exp(-Math.pow((phase - 0.32) * 16, 2)) * 0.55;
  return p1 + p2;
}

// ============ Перестроение ============
function rebuild() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  scale = Math.min(W, H) / 50;
  centerX = W / 2;

  let fyMin = Infinity, fyMax = -Infinity;
  for (let i = 0; i <= 300; i++) {
    const p = heartXY((i / 300) * Math.PI * 2);
    const fy = -p.y;
    if (fy < fyMin) fyMin = fy;
    if (fy > fyMax) fyMax = fy;
  }
  centerY = H / 2 - ((fyMin + fyMax) / 2) * scale;

  contourPts = [];
  const STEPS = 900;
  for (let i = 0; i < STEPS; i++) {
    const tt = (i / STEPS) * Math.PI * 2;
    const p = heartXY(tt);
    contourPts.push({ x: p.x * scale, y: -p.y * scale });
  }

  buildTextLayout();

  drawStartMs = performance.now();
  drawComplete = false;
  textDone = false;
  finaleStarted = false;
  lastBalloonSpawnMs = 0;
  particles.length = 0;
  ripples.length = 0;
  bokeh.length = 0;
  sparkles.length = 0;
  balloons.length = 0;
  confetti.length = 0;
  heartBursts.length = 0;
  lastBeatIdx = -1;
  title.classList.remove('show');
  hint.classList.remove('show');
  finalMessage.classList.remove('show');
}

// ============ Пересечение с горизонталью ============
function insideSegmentsAtY(y) {
  const xs = [];
  const n = contourPts.length;
  for (let i = 0; i < n; i++) {
    const a = contourPts[i];
    const b = contourPts[(i + 1) % n];
    if ((a.y <= y && b.y > y) || (b.y <= y && a.y > y)) {
      const t = (y - a.y) / (b.y - a.y);
      xs.push(a.x + (b.x - a.x) * t);
    }
  }
  xs.sort((p, q) => p - q);
  const segs = [];
  for (let i = 0; i + 1 < xs.length; i += 2) {
    segs.push({ x0: xs[i], x1: xs[i + 1] });
  }
  return segs;
}

// ============ Раскладка текста ============
function buildTextLayout() {
  textRelPts = [];
  let fyMin = Infinity, fyMax = -Infinity;
  for (const p of contourPts) {
    if (p.y < fyMin) fyMin = p.y;
    if (p.y > fyMax) fyMax = p.y;
  }
  const rowH = Math.max(22, scale * 1.55);
  const hGap = Math.max(14, scale * 0.85);
  const sideMargin = scale * 1.4;
  const minSegWidth = 70;

  const pool = [...phrases].sort(() => Math.random() - 0.5);
  let pIdx = 0;

  for (let ry = fyMin + rowH / 2; ry <= fyMax - rowH / 2; ry += rowH) {
    if (pIdx >= pool.length) break;
    const segs = insideSegmentsAtY(ry);
    if (segs.length === 0) continue;

    const fontSize = Math.max(10, Math.min(scale * 0.62, rowH * 0.72));
    ctx.font = `${fontSize}px ${FONT_FAMILY}`;

    for (const seg of segs) {
      if (pIdx >= pool.length) break;
      const x0 = seg.x0 + sideMargin;
      const x1 = seg.x1 - sideMargin;
      if (x1 - x0 < minSegWidth) continue;
      const avail = x1 - x0;

      const chosen = [];
      let used = 0;

      while (pIdx < pool.length && chosen.length < 6) {
        const phrase = pool[pIdx];
        ctx.font = `${fontSize}px ${FONT_FAMILY}`;
        const w = ctx.measureText(phrase).width;
        const need = chosen.length === 0 ? w : used + hGap + w;
        if (need <= avail) {
          chosen.push({ text: phrase, width: w });
          used = need;
          pIdx++;
        } else {
          let taken = false;
          for (let k = 1; k <= 5 && pIdx + k < pool.length; k++) {
            const cand = pool[pIdx + k];
            ctx.font = `${fontSize}px ${FONT_FAMILY}`;
            const cw = ctx.measureText(cand).width;
            const cneed = chosen.length === 0 ? cw : used + hGap + cw;
            if (cneed <= avail) {
              chosen.push({ text: cand, width: cw });
              used = cneed;
              pool.splice(pIdx + k, 1);
              taken = true;
              break;
            }
          }
          if (!taken) break;
        }
      }

      if (chosen.length === 0) continue;
      const totalWidth = chosen.reduce((s, c) => s + c.width, 0) + hGap * (chosen.length - 1);
      let cursor = x0 + (avail - totalWidth) / 2;
      for (const c of chosen) {
        textRelPts.push({
          rx: cursor + c.width / 2,
          ry,
          text: c.text,
          fontSize,
          phase: Math.random() * Math.PI * 2,
          speed: 0.0015 + Math.random() * 0.002,
          color: `hsl(${335 + Math.random() * 25}, 95%, ${62 + Math.random() * 20}%)`,
          appear: 0, delay: 0
        });
        cursor += c.width + hGap;
      }
    }
  }

  if (textRelPts.length === 0) return;
  let rMin = Infinity, rMax = -Infinity;
  for (const p of textRelPts) {
    if (p.ry < rMin) rMin = p.ry;
    if (p.ry > rMax) rMax = p.ry;
  }
  const range = (rMax - rMin) || 1;
  for (const p of textRelPts) {
    p.delay = ((p.ry - rMin) / range) * 0.65 + Math.random() * 0.35;
  }
}

// ============ Спавнеры эффектов ============
function spawnTrailParticle(x, y) {
  particles.push({
    x, y,
    vx: (Math.random() - 0.5) * 1.4,
    vy: (Math.random() - 0.5) * 1.4 - 0.4,
    life: 1,
    size: 1 + Math.random() * 2.5,
    hue: 330 + Math.random() * 40
  });
}

function spawnRipple() {
  ripples.push({
    scale: 1.0,
    grow: 1.0035 + Math.random() * 0.0015,
    alpha: 0.55,
    hue: 335 + Math.random() * 20
  });
}

function spawnBokeh() {
  const angle = Math.random() * Math.PI * 2;
  const radius = scale * (18 + Math.random() * 10);
  bokeh.push({
    x: centerX + Math.cos(angle) * radius,
    y: centerY + Math.sin(angle) * radius,
    vx: (Math.random() - 0.5) * 0.25,
    vy: -0.15 - Math.random() * 0.35,
    life: 1,
    size: 6 + Math.random() * 14,
    hue: 320 + Math.random() * 40,
    light: 60 + Math.random() * 20
  });
}

function spawnSparkle() {
  const angle = Math.random() * Math.PI * 2;
  const radius = scale * (16 + Math.random() * 6);
  sparkles.push({
    x: centerX + Math.cos(angle) * radius,
    y: centerY + Math.sin(angle) * radius,
    life: 1,
    decay: 0.012 + Math.random() * 0.02,
    size: 2 + Math.random() * 3,
    rotation: Math.random() * Math.PI,
    hue: 330 + Math.random() * 30
  });
}

const BALLOON_COLORS = [
  { h: 340, s: 90, l: 65 },
  { h: 350, s: 85, l: 70 },
  { h: 320, s: 80, l: 72 },
  { h: 45,  s: 90, l: 70 },
  { h: 15,  s: 90, l: 65 },
  { h: 280, s: 70, l: 72 }
];

function spawnBalloon(initialDelay = 0) {
  const color = BALLOON_COLORS[Math.floor(Math.random() * BALLOON_COLORS.length)];
  const size = 26 + Math.random() * 22;
  balloons.push({
    x: 40 + Math.random() * (W - 80),
    y: initialDelay > 0
       ? H + size * 2 + initialDelay * 60      // ставим ниже экрана
       : H + size * 2,
    vy: -1.2 - Math.random() * 1.4,
    swayAmp: 20 + Math.random() * 40,
    swaySpeed: 0.008 + Math.random() * 0.012,
    swayPhase: Math.random() * Math.PI * 2,
    size,
    color,
    stringLen: size * 1.4,
    life: 1,
    rotation: (Math.random() - 0.5) * 0.15
  });
}

function spawnConfetti() {
  const hue = Math.random() * 360;
  confetti.push({
    x: Math.random() * W,
    y: -20 - Math.random() * 40,
    vx: (Math.random() - 0.5) * 1.5,
    vy: 1.8 + Math.random() * 2.5,
    rotation: Math.random() * Math.PI * 2,
    rotSpeed: (Math.random() - 0.5) * 0.2,
    w: 6 + Math.random() * 8,
    h: 3 + Math.random() * 5,
    hue,
    life: 1
  });
}

function spawnHeartBurst(cx, cy) {
  const angle = Math.random() * Math.PI * 2;
  const speed = 4 + Math.random() * 8;
  heartBursts.push({
    x: cx,
    y: cy,
    vx: Math.cos(angle) * speed,
    vy: Math.sin(angle) * speed - 2,
    gravity: 0.15,
    size: 8 + Math.random() * 14,
    life: 1,
    decay: 0.008 + Math.random() * 0.008,
    hue: 330 + Math.random() * 30,
    rotation: (Math.random() - 0.5) * 0.5,
    rotSpeed: (Math.random() - 0.5) * 0.1
  });
}

// Полный праздничный залп
function celebrate(cx, cy) {
  if (finaleStarted) return;
  finaleStarted = true;

  // Стартовая волна шариков — распределяем по вертикали, чтобы сразу летели стеной
  for (let i = 0; i < 35; i++) spawnBalloon(Math.random() * 3);

  // Конфетти — три волны
  for (let i = 0; i < 60; i++) spawnConfetti();
  setTimeout(() => { if (finaleStarted) for (let i = 0; i < 50; i++) spawnConfetti(); }, 400);
  setTimeout(() => { if (finaleStarted) for (let i = 0; i < 40; i++) spawnConfetti(); }, 900);

  // Сердечки из точки клика
  for (let i = 0; i < 60; i++) spawnHeartBurst(cx, cy);

  // Финальное сообщение
  setTimeout(() => {
    finalMessage.classList.add('show');
  }, 1300);
}

// ============ Главный цикл ============
function draw() {
  ctx.fillStyle = 'rgba(10, 0, 5, 0.22)';
  ctx.fillRect(0, 0, W, H);

  const now = performance.now();
  const elapsed = now - drawStartMs;

  let revealCount;
  if (!drawComplete) {
    const tt = Math.min(1, elapsed / DRAW_DURATION_MS);
    revealCount = Math.floor(tt * contourPts.length);
    if (tt >= 1) {
      drawComplete = true;
      textStartMs = now;
      setTimeout(() => {
        title.classList.add('show');
        hint.classList.add('show');
      }, 500);
    }
  } else {
    revealCount = contourPts.length;
  }

  // ==== Сердцебиение ====
  const beatT = (now / 1000) / BEAT_PERIOD;
  beatPhase = beatT - Math.floor(beatT);
  const hb = drawComplete ? heartbeat(beatPhase) : 0;

  const breath = drawComplete ? 1 + hb * 0.035 : 1;
  const baseAlpha = drawComplete ? 0.75 + hb * 0.35 : 1;

  if (drawComplete) {
    const beatIdx = Math.floor(beatT);
    if (beatIdx !== lastBeatIdx && beatPhase < 0.12) {
      lastBeatIdx = beatIdx;
      spawnRipple();
      for (let i = 0; i < 3; i++) spawnSparkle();
    }
    if (Math.random() < 0.35) spawnBokeh();
  }

  // ==== Бесконечный поток шариков после клика ====
  if (finaleStarted && now - lastBalloonSpawnMs > BALLOON_SPAWN_INTERVAL) {
    lastBalloonSpawnMs = now;
    if (balloons.length < MAX_BALLOONS) spawnBalloon();
  }

  const hueShift = Math.sin(now * 0.0002) * 15;

  // ============ Боке ============
  for (let i = bokeh.length - 1; i >= 0; i--) {
    const b = bokeh[i];
    b.x += b.vx;
    b.y += b.vy;
    b.life -= 0.004;
    if (b.life <= 0) { bokeh.splice(i, 1); continue; }
    const a = b.life * 0.35;
    const grad = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.size);
    grad.addColorStop(0, `hsla(${b.hue + hueShift}, 100%, ${b.light}%, ${a})`);
    grad.addColorStop(1, `hsla(${b.hue + hueShift}, 100%, ${b.light}%, 0)`);
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.size, 0, Math.PI * 2);
    ctx.fill();
  }

  // ============ Эхо-сердца ============
  if (drawComplete) {
    for (let i = ripples.length - 1; i >= 0; i--) {
      const r = ripples[i];
      r.scale += r.grow;
      r.alpha *= 0.985;
      if (r.alpha < 0.02 || r.scale > 2.2) { ripples.splice(i, 1); continue; }
      ctx.save();
      ctx.translate(centerX, centerY);
      ctx.scale(r.scale * breath, r.scale * breath);
      ctx.beginPath();
      ctx.moveTo(contourPts[0].x, contourPts[0].y);
      for (let k = 1; k < contourPts.length; k++) {
        ctx.lineTo(contourPts[k].x, contourPts[k].y);
      }
      ctx.closePath();
      ctx.strokeStyle = `hsla(${r.hue + hueShift}, 100%, 65%, ${r.alpha})`;
      ctx.shadowColor = `hsla(${r.hue + hueShift}, 100%, 65%, ${r.alpha})`;
      ctx.shadowBlur = 18;
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.restore();
    }
    ctx.shadowBlur = 0;
  }

  // ============ Контур ============
  if (revealCount >= 2) {
    ctx.lineWidth = 3;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';

    ctx.beginPath();
    const p0 = contourPts[0];
    ctx.moveTo(centerX + p0.x * breath, centerY + p0.y * breath);
    for (let i = 1; i < revealCount; i++) {
      const p = contourPts[i];
      ctx.lineTo(centerX + p.x * breath, centerY + p.y * breath);
    }
    ctx.strokeStyle = `hsla(${340 + hueShift}, 100%, 62%, ${baseAlpha * 0.8})`;
    ctx.shadowColor = `hsla(${340 + hueShift}, 100%, 65%, ${baseAlpha * 0.75})`;
    ctx.shadowBlur = 16 + hb * 20;
    ctx.stroke();

    if (!drawComplete) {
      const trailStart = Math.max(0, revealCount - TRAIL_LENGTH);
      const denom = (revealCount - trailStart) || 1;
      for (let i = trailStart + 1; i < revealCount; i++) {
        const a = contourPts[i - 1];
        const b = contourPts[i];
        const age = (i - trailStart) / denom;
        const alpha = baseAlpha * Math.pow(age, 1.4);
        ctx.strokeStyle = `hsla(${340 + hueShift}, 100%, ${60 + age * 40}%, ${alpha})`;
        ctx.shadowColor = `hsla(${340 + hueShift}, 100%, 70%, ${alpha})`;
        ctx.shadowBlur = 22;
        ctx.beginPath();
        ctx.moveTo(centerX + a.x * breath, centerY + a.y * breath);
        ctx.lineTo(centerX + b.x * breath, centerY + b.y * breath);
        ctx.stroke();
      }
    }

    if (!drawComplete && revealCount > 0) {
      const head = contourPts[revealCount - 1];
      const hx = centerX + head.x * breath;
      const hy = centerY + head.y * breath;
      ctx.fillStyle = '#fff';
      ctx.shadowColor = '#ff5f9e';
      ctx.shadowBlur = 30;
      ctx.beginPath();
      ctx.arc(hx, hy, 5, 0, Math.PI * 2);
      ctx.fill();
      if (Math.random() < 0.8) spawnTrailParticle(hx, hy);
    }
  }
  ctx.shadowBlur = 0;

  // ============ Появление текста ============
  if (drawComplete && !textDone) {
    const textElapsed = (now - textStartMs) / 1000;
    const revealDuration = 3.5;
    let allDone = true;
    for (const p of textRelPts) {
      const local = (textElapsed - p.delay * revealDuration) / (revealDuration * 0.6);
      const target = Math.max(0, Math.min(1, local));
      p.appear += (target - p.appear) * 0.15;
      if (p.appear < 0.98) allDone = false;
    }
    if (allDone) textDone = true;
  }

  // ============ Текст ============
  if (drawComplete) {
    for (const p of textRelPts) {
      if (p.appear <= 0.01) continue;
      const driftX = Math.sin(time * p.speed + p.phase) * 1.2 * breath;
      const driftY = Math.cos(time * p.speed * 1.2 + p.phase) * 1.2 * breath;
      const x = centerX + p.rx * breath + driftX;
      const y = centerY + p.ry * breath + driftY;

      const shimmer = 0.65 + 0.35 * Math.sin(time * 0.004 + p.phase);
      const scaleIn = 0.6 + 0.4 * p.appear;
      const alpha = p.appear * shimmer * (0.8 + hb * 0.25);

      ctx.save();
      ctx.translate(x, y);
      ctx.scale(scaleIn, scaleIn);
      ctx.globalAlpha = Math.min(1, alpha);
      ctx.fillStyle = p.color;
      ctx.shadowColor = p.color;
      ctx.shadowBlur = 8 * p.appear;
      ctx.font = `${p.fontSize}px ${FONT_FAMILY}`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(p.text, 0, 0);
      ctx.restore();
    }
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
  }

  // ============ Частицы от пера ============
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.02;
    p.life -= 0.02;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    ctx.globalAlpha = p.life;
    ctx.fillStyle = `hsl(${p.hue + hueShift}, 100%, 70%)`;
    ctx.shadowColor = `hsl(${p.hue + hueShift}, 100%, 65%)`;
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.shadowBlur = 0;
  ctx.globalAlpha = 1;

  // ============ Звёздочки ============
  for (let i = sparkles.length - 1; i >= 0; i--) {
    const s = sparkles[i];
    s.life -= s.decay;
    if (s.life <= 0) { sparkles.splice(i, 1); continue; }
    const a = s.life;
    const len = s.size * s.life;
    ctx.save();
    ctx.translate(s.x, s.y);
    ctx.rotate(s.rotation);
    ctx.globalAlpha = a;
    ctx.strokeStyle = `hsl(${s.hue + hueShift}, 100%, 80%)`;
    ctx.shadowColor = `hsl(${s.hue + hueShift}, 100%, 70%)`;
    ctx.shadowBlur = 15;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(-len, 0);
    ctx.lineTo(len, 0);
    ctx.moveTo(0, -len);
    ctx.lineTo(0, len);
    ctx.stroke();
    ctx.restore();
  }
  ctx.shadowBlur = 0;
  ctx.globalAlpha = 1;

  // ============ 🎈 ШАРИКИ ============
  for (let i = balloons.length - 1; i >= 0; i--) {
    const b = balloons[i];
    b.swayPhase += b.swaySpeed;
    b.y += b.vy;
    b.x += Math.sin(b.swayPhase) * 0.8;

    if (b.y < -b.size * 3) { balloons.splice(i, 1); continue; }

    const { h, s, l } = b.color;
    const bx = b.x;
    const by = b.y;
    const r = b.size;

    ctx.strokeStyle = `hsla(${h}, 40%, 70%, 0.5)`;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(bx, by + r * 1.05);
    ctx.quadraticCurveTo(
      bx + Math.sin(b.swayPhase * 2) * 8,
      by + r * 1.05 + b.stringLen * 0.5,
      bx + Math.sin(b.swayPhase * 2) * 15,
      by + r * 1.05 + b.stringLen
    );
    ctx.stroke();

    ctx.save();
    ctx.translate(bx, by);
    ctx.rotate(b.rotation + Math.sin(b.swayPhase) * 0.05);

    ctx.shadowColor = `hsla(${h}, 100%, 60%, 0.6)`;
    ctx.shadowBlur = 25;

    const grad = ctx.createRadialGradient(-r * 0.3, -r * 0.4, r * 0.1, 0, 0, r);
    grad.addColorStop(0, `hsl(${h}, ${s}%, ${l + 20}%)`);
    grad.addColorStop(0.6, `hsl(${h}, ${s}%, ${l}%)`);
    grad.addColorStop(1, `hsl(${h}, ${s}%, ${l - 15}%)`);

    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.ellipse(0, 0, r * 0.85, r, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.shadowBlur = 0;
    ctx.fillStyle = `hsla(0, 0%, 100%, 0.55)`;
    ctx.beginPath();
    ctx.ellipse(-r * 0.3, -r * 0.4, r * 0.18, r * 0.28, -0.5, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = `hsl(${h}, ${s}%, ${l - 20}%)`;
    ctx.beginPath();
    ctx.moveTo(-4, r * 1.0);
    ctx.lineTo(4, r * 1.0);
    ctx.lineTo(0, r * 1.15);
    ctx.closePath();
    ctx.fill();

    ctx.restore();
  }
  ctx.shadowBlur = 0;

  // ============ 🎊 КОНФЕТТИ ============
  for (let i = confetti.length - 1; i >= 0; i--) {
    const c = confetti[i];
    c.x += c.vx;
    c.y += c.vy;
    c.vy += 0.02;
    c.vx += Math.sin(c.y * 0.02) * 0.02;
    c.rotation += c.rotSpeed;

    if (c.y > H + 30) { confetti.splice(i, 1); continue; }

    ctx.save();
    ctx.translate(c.x, c.y);
    ctx.rotate(c.rotation);
    ctx.fillStyle = `hsl(${c.hue}, 90%, 65%)`;
    ctx.shadowColor = `hsl(${c.hue}, 90%, 60%)`;
    ctx.shadowBlur = 6;
    ctx.fillRect(-c.w / 2, -c.h / 2, c.w, c.h);
    ctx.restore();
  }
  ctx.shadowBlur = 0;

  // ============ 💗 РАЗЛЕТАЮЩИЕСЯ СЕРДЕЧКИ ============
  for (let i = heartBursts.length - 1; i >= 0; i--) {
    const hb2 = heartBursts[i];
    hb2.x += hb2.vx;
    hb2.y += hb2.vy;
    hb2.vy += hb2.gravity;
    hb2.vx *= 0.99;
    hb2.rotation += hb2.rotSpeed;
    hb2.life -= hb2.decay;

    if (hb2.life <= 0 || hb2.y > H + 50) { heartBursts.splice(i, 1); continue; }

    const a = Math.min(1, hb2.life);
    const s = hb2.size * (0.5 + hb2.life * 0.7);

    ctx.save();
    ctx.translate(hb2.x, hb2.y);
    ctx.rotate(hb2.rotation);
    ctx.globalAlpha = a;
    ctx.fillStyle = `hsl(${hb2.hue}, 100%, 68%)`;
    ctx.shadowColor = `hsl(${hb2.hue}, 100%, 65%)`;
    ctx.shadowBlur = 15;
    ctx.beginPath();
    ctx.moveTo(0, s * 0.35);
    ctx.bezierCurveTo(-s * 0.9, -s * 0.3, -s * 0.5, -s * 0.9, 0, -s * 0.4);
    ctx.bezierCurveTo(s * 0.5, -s * 0.9, s * 0.9, -s * 0.3, 0, s * 0.35);
    ctx.fill();
    ctx.restore();
  }
  ctx.shadowBlur = 0;
  ctx.globalAlpha = 1;

  time++;
  requestAnimationFrame(draw);
}

// ============ Клик по сердцу ============
canvas.addEventListener('click', (e) => {
  if (!drawComplete || !textDone || finaleStarted) return;
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  const dx = mx - centerX;
  const dy = my - centerY;
  if (dx*dx + dy*dy < (scale * 20) ** 2) {
    celebrate(mx, my);
  }
});

finalMessage.addEventListener('click', () => {
  finalMessage.classList.remove('show');
});

window.addEventListener('resize', rebuild);

rebuild();
draw();
</script>
